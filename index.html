<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9ec9ff">
<title>Voxel Craft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div id="hud">
  <div id="hudBody">
    <div class="row"><span id="hFps">FPS --</span></div>
    <div class="row"><span id="hPos">XYZ 0 0 0</span></div>
    <div class="row"><span id="hChunk">Chunk 0,0</span></div>
    <div class="row"><span id="hLoaded">Chunks 0</span></div>
    <div class="row"><span id="hTris">Tris 0</span></div>
    <div class="row"><span id="hQueue">Queue 0</span></div>
  </div>
  <div id="hudToggle">HIDE</div>
</div>
<div id="hotbar"></div>
<div id="joyBase"></div>
<div id="joyStick"></div>
<div id="jumpBtn">JUMP</div>
<div id="flyUpBtn" class="flyBtn">飞</div>
<div id="flyDownBtn" class="flyBtn">降</div>
<div id="landBtn" class="flyBtn">落</div>
<div id="settingsBtn">⚙</div>
<div id="settingsPanel">
  <div class="sp-close" id="spClose">✕</div>
  <div class="sp-title">设置</div>
  <div class="sp-row">
    <label>移动 / 飞行 / 降落速度</label>
    <div class="sp-slider-wrap">
      <input type="range" id="spSpeed" min="0.5" max="3" step="0.1" value="1">
      <span class="sp-val" id="spSpeedVal">1.0×</span>
    </div>
  </div>
  <div class="sp-row">
    <label>跳跃高度</label>
    <div class="sp-slider-wrap">
      <input type="range" id="spJump" min="0.5" max="2.5" step="0.1" value="1">
      <span class="sp-val" id="spJumpVal">1.0×</span>
    </div>
  </div>
  <div class="sp-row">
    <label>视野可见范围（区块）</label>
    <div class="sp-slider-wrap">
      <input type="range" id="spRadius" min="2" max="10" step="1" value="5">
      <span class="sp-val" id="spRadiusVal">5</span>
    </div>
  </div>
  <div class="sp-switch-row">
    <label>飞行模式</label>
    <label class="sp-switch">
      <input type="checkbox" id="spFly">
      <span class="sp-track"></span>
    </label>
  </div>
  <div class="sp-switch-row">
    <label>清除本地存档</label>
    <button id="clearSaveBtn" style="background:rgba(255,80,80,.3);border:1px solid rgba(255,80,80,.5);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;">清除</button>
  </div>
</div>
<div id="toast"></div>

<div id="overlay">
  <div class="glass-panel">
    <h1>VOXEL CRAFT</h1>
    <p>
      移动端：左下半区拖拽 = 摇杆移动 · 右半区拖拽 = 转视角<br>
      轻点 = 破坏方块 · 长按 = 放置方块 · 右下角按钮 = 跳跃<br>
      桌面端：WASD 移动 · 空格跳跃 · Shift 加速<br>
      鼠标左键破坏 · 右键放置 · 点击画面锁定指针<br>
      <span style="color:#6ee7a8">💾 世界自动存档已启用</span>
    </p>
    <button id="startBtn">开始游戏</button>
    <div id="loading">正在初始化…</div>
    <div class="copyright">网页作者: <span>lil-lotus</span></div>
  </div>
</div>

<!-- ⚠️ importmap 必须内联，且必须在 module 脚本之前，不能拆出去 -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="script.js"></script>
</body>
</html>
